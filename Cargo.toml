[workspace]
resolver = "2"
members = [
    "crates/integrity",
    "crates/block-map",
    "crates/manifest",
    "crates/journal",
    "crates/cache-manager",
    "crates/provider-contract",
    "crates/provider-gdrive",
    "crates/provider-telegram",
    "crates/security",
    "crates/storage-core",
    "apps/desktop/src-tauri"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The workspace uses `u64::div_ceil` (Rust 1.73) and `Option::is_none_or`
# (Rust 1.82), so 1.82 is the true minimum supported version.
rust-version = "1.82"
authors = ["Chaudary Global <info@chaudaryglobal.com>"]
license = "MIT"
repository = "https://github.com/ahmad-abdullah-chaudary/virtualssd"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
sha2 = "0.10"
aes-gcm = "0.10"
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
parking_lot = "0.12"
bytes = "1.7"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
zeroize = { version = "1.8", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }
tempfile = "3.12"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Vhd",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
] }
