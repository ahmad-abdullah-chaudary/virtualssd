name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The workspace redirects Cargo's target directory to an absolute path
  # (see .cargo/config.toml) so that Windows Defender does not scan freshly
  # written files mid-build. On CI that path would land outside the
  # checkout, so the target directory is moved back inside the workspace.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  rust:
    name: Rust workspace
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the Cargo build directory
        uses: Swatinem/rust-cache@v2

      - name: Check every target
        run: cargo check --workspace --all-targets

      - name: Run the test suites
        run: cargo test --workspace

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  frontend:
    name: Frontend
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      # pnpm must be on the PATH before setup-node runs, because setup-node
      # calls `pnpm store path` to locate the package cache.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: pnpm build

  release-artifacts:
    name: Release artifacts
    runs-on: windows-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Cargo build directory
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the desktop application and installers
        working-directory: apps/desktop
        run: npx tauri build

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: virtualssd-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/virtualssd-desktop.exe
            # The application links the WebView2 loader dynamically, so the
            # DLL has to travel with a bare copy of the executable.
            target/release/WebView2Loader.dll
          if-no-files-found: error
