[package]
name = "virtualssd-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

virtualssd-integrity = { path = "../../../crates/integrity" }
virtualssd-block-map = { path = "../../../crates/block-map" }
virtualssd-manifest = { path = "../../../crates/manifest" }
virtualssd-journal = { path = "../../../crates/journal" }
virtualssd-cache-manager = { path = "../../../crates/cache-manager" }
virtualssd-provider-contract = { path = "../../../crates/provider-contract" }
virtualssd-provider-gdrive = { path = "../../../crates/provider-gdrive" }
virtualssd-provider-telegram = { path = "../../../crates/provider-telegram" }
virtualssd-security = { path = "../../../crates/security" }
virtualssd-storage-core = { path = "../../../crates/storage-core" }
zeroize = { workspace = true, features = ["derive"] }
windows.workspace = true

[dev-dependencies]
tempfile.workspace = true
